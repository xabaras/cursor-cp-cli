<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cursor Control Plane + CLI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.x.x/dist/purify.min.js"></script>
  <style>
    [x-cloak] { display: none !important; }
    .streaming-cursor::after {
      content: '\25ae';
      animation: blink 1s infinite;
    }
    @keyframes blink {
      0%, 50% { opacity: 1; }
      51%, 100% { opacity: 0; }
    }
    .code-block {
      background: #1e1e1e;
      border-radius: 0.5rem;
      padding: 1rem;
      overflow-x: auto;
      margin: 0.5rem 0;
    }
    .code-block pre {
      color: #d4d4d4;
      font-family: 'Menlo', 'Monaco', 'Courier New', monospace;
      font-size: 0.875rem;
      line-height: 1.5;
    }

    /* Rendered markdown (marked + DOMPurify) — prose plugin not available on Tailwind CDN */
    .message-content {
      line-height: 1.65;
      word-break: break-word;
      font-size: 0.9375rem;
    }
    .message-content > :first-child { margin-top: 0; }
    .message-content > :last-child { margin-bottom: 0; }
    .message-content p { margin: 0.65em 0; }
    .message-content h1,
    .message-content h2,
    .message-content h3,
    .message-content h4 {
      font-weight: 600;
      line-height: 1.3;
      margin: 1em 0 0.5em;
    }
    .message-content h1 { font-size: 1.35rem; }
    .message-content h2 { font-size: 1.2rem; }
    .message-content h3 { font-size: 1.05rem; }
    .message-content h4 { font-size: 0.95rem; }
    .message-content ul,
    .message-content ol {
      margin: 0.65em 0;
      padding-left: 1.4em;
    }
    .message-content li { margin: 0.25em 0; }
    .message-content li > ul,
    .message-content li > ol { margin: 0.25em 0; }
    .message-content blockquote {
      margin: 0.75em 0;
      padding: 0.25em 0 0.25em 0.9em;
      border-left: 3px solid #6b7280;
      color: #d1d5db;
    }
    .message-content hr {
      border: none;
      border-top: 1px solid #4b5563;
      margin: 1em 0;
    }
    .message-content pre {
      background: #111827;
      border: 1px solid #374151;
      border-radius: 0.5rem;
      padding: 0.85rem 1rem;
      overflow-x: auto;
      margin: 0.75em 0;
    }
    .message-content pre code {
      background: transparent;
      padding: 0;
      border-radius: 0;
      font-family: 'Menlo', 'Monaco', 'Courier New', monospace;
      font-size: 0.8125rem;
      line-height: 1.55;
      color: #e5e7eb;
    }
    .message-content :not(pre) > code {
      background: rgba(0, 0, 0, 0.35);
      padding: 0.12em 0.35em;
      border-radius: 0.25rem;
      font-family: 'Menlo', 'Monaco', 'Courier New', monospace;
      font-size: 0.85em;
    }
    .message-content a {
      color: #93c5fd;
      text-decoration: underline;
      text-underline-offset: 2px;
    }
    .message-content a:hover { color: #bfdbfe; }
    .message-content table {
      width: 100%;
      border-collapse: collapse;
      margin: 0.75em 0;
      font-size: 0.875rem;
    }
    .message-content th,
    .message-content td {
      border: 1px solid #4b5563;
      padding: 0.45em 0.65em;
      text-align: left;
    }
    .message-content th {
      background: rgba(0, 0, 0, 0.25);
      font-weight: 600;
    }
    .message-content input[type='checkbox'] {
      margin-right: 0.4em;
      vertical-align: middle;
    }
    .message-content-user :not(pre) > code {
      background: rgba(255, 255, 255, 0.16);
    }
    .message-content-user pre {
      background: rgba(0, 0, 0, 0.22);
      border-color: rgba(255, 255, 255, 0.15);
    }
    .message-content-user a { color: #dbeafe; }
    .message-content-plain {
      white-space: pre-wrap;
      line-height: 1.6;
      word-break: break-word;
    }

    .session-card {
      border-radius: 0.75rem;
      border: 1px solid transparent;
      background: rgba(55, 65, 81, 0.45);
      padding: 0.625rem 0.75rem;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s, box-shadow 0.15s;
    }
    .session-card:hover {
      background: rgba(75, 85, 99, 0.55);
      border-color: rgba(107, 114, 128, 0.35);
    }
    .session-card-active {
      border-color: rgba(59, 130, 246, 0.45) !important;
      background: rgba(37, 99, 235, 0.15) !important;
      box-shadow: inset 0 0 0 1px rgba(59, 130, 246, 0.12);
    }
    /* Scrollbar styling */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #1f2937;
    }
    ::-webkit-scrollbar-thumb {
      background: #4b5563;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #6b7280;
    }
  </style>
</head>
<body class="bg-gray-900 text-white h-screen overflow-hidden">
  <div class="flex h-full flex-col" x-data="dashboard()" x-init="init()">
    <!-- Title bar + panel toggle (always visible) -->
    <div class="shrink-0 flex flex-col border-b border-gray-700 bg-gray-800/95 z-50 max-md:fixed max-md:left-0 max-md:right-0 max-md:top-0 md:relative">
      <header class="flex items-center justify-between gap-3 px-4 py-3">
        <h1 class="text-lg font-bold text-blue-400 truncate">Cursor CP</h1>
        <div class="flex shrink-0 items-center gap-2 text-xs text-gray-500">
          <span
            class="h-2 w-2 rounded-full"
            :class="wsState === 'connected' ? 'bg-green-400' : 'bg-gray-600'"
            :title="'WebSocket: ' + wsState"
          ></span>
          <span x-text="wsState === 'connected' ? 'Live' : 'Offline'"></span>
        </div>
      </header>
      <div class="flex items-center px-4 pb-2">
        <button
          type="button"
          @click="toggleSidebar()"
          class="inline-flex h-9 w-9 shrink-0 items-center justify-center rounded-lg text-gray-400 transition hover:bg-gray-700 hover:text-white focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500/40"
          :title="sidebarCollapsed ? 'Show sessions and settings' : 'Hide side panel'"
          :aria-label="sidebarCollapsed ? 'Show sessions and settings' : 'Hide side panel'"
          :aria-expanded="!sidebarCollapsed"
          aria-controls="sidebar-panel"
        >
          <svg
            x-show="!sidebarCollapsed"
            class="h-5 w-5"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="2"
            aria-hidden="true"
          >
            <path stroke-linecap="round" stroke-linejoin="round" d="M11.25 19.5L4.5 12l6.75-7.5M18.75 19.5L12 12l6.75-7.5" />
          </svg>
          <svg
            x-show="sidebarCollapsed"
            x-cloak
            class="h-5 w-5"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="2"
            aria-hidden="true"
          >
            <path stroke-linecap="round" stroke-linejoin="round" d="M12.75 19.5l6.75-7.5-6.75-7.5M5.25 19.5L12 12 5.25 4.5" />
          </svg>
        </button>
      </div>
    </div>

    <div class="flex min-h-0 flex-1 flex-col overflow-hidden max-md:pt-[5.75rem] md:flex-row">
      <!-- Mobile: tap outside to close sidebar -->
      <div
        x-show="!sidebarCollapsed"
        x-cloak
        @click="toggleSidebar()"
        class="fixed inset-x-0 bottom-0 top-[5.75rem] z-40 bg-black/50 md:hidden"
        aria-hidden="true"
      ></div>

      <!-- Sidebar -->
      <aside
        id="sidebar-panel"
        x-show="!sidebarCollapsed"
        x-cloak
        class="flex w-full max-w-[20rem] shrink-0 flex-col overflow-hidden min-h-0 border-b border-gray-700 bg-gray-800
               max-md:fixed max-md:inset-x-0 max-md:bottom-0 max-md:top-[5.75rem] max-md:z-50 max-md:shadow-2xl
               md:relative md:h-full md:border-b-0 md:border-r"
      >
      <!-- Sidebar header -->
      <div class="p-4 border-b border-gray-700 shrink-0">
        <button
          @click="showNewSessionModal = true"
          :disabled="atSessionLimit"
          class="w-full py-2 px-4 bg-blue-600 hover:bg-blue-500 disabled:bg-gray-600 disabled:cursor-not-allowed rounded-lg font-medium transition-colors flex items-center justify-center gap-2"
        >
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
          </svg>
          New Session
        </button>
        <p x-show="atSessionLimit" class="text-xs text-red-400 mt-2 text-center" x-text="`Maximum ${maxSessions} sessions reached`"></p>
      </div>

      <!-- Session List -->
      <div class="flex-1 overflow-y-auto p-4">
        <div class="mb-2 flex items-start justify-between gap-2 px-1">
          <div class="min-w-0 flex-1">
            <h2 class="text-xs font-semibold uppercase tracking-wider text-gray-500">Sessions</h2>
            <p class="text-[10px] text-gray-600">Max <span x-text="maxSessions"></span> · closing removes chat history</p>
          </div>
          <button
            type="button"
            @click="closeAllSessions()"
            x-show="sessions.length > 0"
            class="shrink-0 rounded border border-gray-600 bg-gray-700/80 px-2 py-1 text-[10px] font-medium text-gray-300 transition hover:border-amber-500/40 hover:bg-gray-600 hover:text-amber-200"
            title="Close and remove all sessions"
          >Close all</button>
        </div>

        <p x-show="sessions.length === 0" class="rounded-lg border border-dashed border-gray-700 bg-gray-800/30 px-3 py-8 text-center text-xs text-gray-500">
          No sessions yet. Create one above.
        </p>

        <ul class="space-y-1.5">
          <template x-for="session in sessions" :key="session.id">
            <li>
              <button
                type="button"
                @click="selectSession(session.id)"
                class="session-card w-full text-left"
                :class="{ 'session-card-active': selectedSessionId === session.id }"
              >
                <div class="flex items-start justify-between gap-2">
                  <span
                    class="line-clamp-2 text-sm font-medium text-gray-100"
                    x-text="session.title || session.repo_name || 'Untitled'"
                  ></span>
                  <span
                    class="shrink-0 rounded-md px-1.5 py-0.5 text-[10px] font-semibold uppercase tracking-wide"
                    :class="session.status === 'open' ? 'bg-emerald-500/15 text-emerald-400' : 'bg-gray-600/40 text-gray-400'"
                    x-text="session.status"
                  ></span>
                </div>
                <div class="mt-1.5 flex min-w-0 items-center gap-2 text-[11px] text-gray-500">
                  <span
                    class="min-w-0 truncate font-mono text-gray-500"
                    :title="sessionWorkspacePath(session)"
                    x-text="sessionWorkspacePath(session)"
                  ></span>
                  <span class="text-gray-600">·</span>
                  <span class="shrink-0 capitalize" x-text="session.activity"></span>
                </div>
              </button>
            </li>
          </template>
        </ul>
      </div>

      <!-- Settings -->
      <div class="p-4 border-t border-gray-700 shrink-0">
        <h3 class="text-sm font-medium text-gray-400 mb-2">Default Model</h3>
        <select
          x-model="defaultModelPreference"
          @change="saveDefaultModel()"
          class="w-full bg-gray-700 text-white rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
        >
          <option value="">Auto</option>
          <template x-for="model in availableModels" :key="model.id">
            <option :value="model.id" x-text="model.name"></option>
          </template>
        </select>
        <p x-show="modelsLoadError" class="text-xs text-red-400 mt-1" x-text="modelsLoadError"></p>
      </div>
      </aside>

    <!-- Main Chat Area -->
    <main class="flex-1 flex flex-col min-w-0 min-h-0 overflow-hidden">

      <!-- Session Header -->
      <div class="p-4 border-b border-gray-700 bg-gray-800" x-show="selectedSession" x-cloak>
        <div class="flex items-center justify-between">
          <div>
            <h2 class="font-semibold" x-text="selectedSession?.title || selectedSession?.repo_name"></h2>
            <p class="text-sm text-gray-400">
              <span
                class="font-mono text-xs"
                :title="sessionWorkspacePath(selectedSession)"
                x-text="sessionWorkspacePath(selectedSession)"
              ></span>
              <span class="mx-2">|</span>
              <span x-text="selectedSession?.model || 'Auto'"></span>
            </p>
          </div>
          <div class="flex items-center gap-3">
            <button
              type="button"
              @click="closeSession(selectedSessionId)"
              class="rounded border border-gray-600 px-2 py-1 text-xs text-gray-300 hover:border-red-500/40 hover:text-red-300"
              title="Close session"
            >Close</button>
            <span
              class="px-3 py-1 rounded-full text-xs font-medium"
              :class="{
                'bg-green-900 text-green-300': selectedSession?.activity === 'idle',
                'bg-yellow-900 text-yellow-300': selectedSession?.activity === 'running',
                'bg-blue-900 text-blue-300': selectedSession?.activity === 'waiting_user',
                'bg-red-900 text-red-300': selectedSession?.activity === 'error'
              }"
              x-text="selectedSession?.activity"
            ></span>
          </div>
        </div>
      </div>

      <!-- Messages -->
      <div class="flex-1 overflow-y-auto p-4 space-y-4" id="messages-container" x-ref="messagesContainer">
        <!-- Empty State -->
        <div x-show="!selectedSession" class="h-full flex items-center justify-center text-gray-500">
          <div class="text-center">
            <svg class="w-16 h-16 mx-auto mb-4 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"/>
            </svg>
            <p>Select or create a session to start</p>
          </div>
        </div>

        <!-- Loading State -->
        <div x-show="selectedSession && messages.length === 0 && !awaitingAgentReply" class="text-center text-gray-500 py-8">
          <p>No messages yet. Send a prompt to start the conversation.</p>
        </div>

        <!-- Message List -->
        <template x-for="(msg, index) in messages" :key="index">
          <div
            class="flex"
            :class="msg.role === 'user' ? 'justify-end' : 'justify-start'"
          >
            <div
              class="max-w-[80%] rounded-lg p-4"
              :class="{
                'bg-blue-600 text-white': msg.role === 'user',
                'bg-gray-700 text-gray-100': msg.role === 'assistant'
              }"
            >
              <div
                x-show="msg.role === 'user'"
                class="message-content-plain"
                x-text="msg.content"
              ></div>
              <div
                x-show="msg.role !== 'user'"
                class="message-content"
                x-html="renderMarkdown(msg.content)"
              ></div>
            </div>
          </div>
        </template>

        <!-- Streaming Output (plain text while incomplete; final message renders as markdown) -->
        <div x-show="streamText" class="flex justify-start">
          <div class="max-w-[80%] rounded-lg p-4 bg-gray-700 text-gray-100">
            <div class="message-content-plain streaming-cursor" x-text="streamText"></div>
          </div>
        </div>

        <!-- Pending Question -->
        <div x-show="pendingQuestion" class="flex justify-start">
          <div class="max-w-[80%] rounded-lg p-4 bg-blue-900">
            <p class="font-medium mb-3" x-text="pendingQuestion?.question"></p>
            <div class="flex flex-wrap gap-2">
              <template x-for="option in pendingQuestion?.options" :key="option">
                <button
                  @click="answerQuestion(option)"
                  class="px-4 py-2 bg-blue-600 hover:bg-blue-500 rounded-lg text-sm font-medium transition-colors"
                  x-text="option"
                ></button>
              </template>
            </div>
          </div>
        </div>
      </div>

      <!-- Input Area -->
      <div class="p-4 border-t border-gray-700 bg-gray-800" x-show="selectedSession" x-cloak>
        <form @submit.prevent="sendMessage()" class="flex gap-2">
          <textarea
            x-model="draft"
            @keydown.enter.prevent="if (!event.shiftKey) sendMessage()"
            placeholder="Type your message... (Shift+Enter for new line)"
            class="flex-1 bg-gray-700 text-white rounded-lg px-4 py-3 resize-none focus:outline-none focus:ring-2 focus:ring-blue-500"
            rows="2"
            :disabled="awaitingAgentReply"
          ></textarea>
          <button
            type="submit"
            :disabled="!canSend"
            class="px-6 py-3 bg-blue-600 hover:bg-blue-500 disabled:bg-gray-600 disabled:cursor-not-allowed rounded-lg font-medium transition-colors"
          >
            <svg x-show="!awaitingAgentReply" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/>
            </svg>
            <svg x-show="awaitingAgentReply" class="w-5 h-5 animate-spin" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
          </button>
        </form>
      </div>
    </main>
    </div>

    <!-- New Session Modal -->
    <div
      x-show="showNewSessionModal"
      class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50"
      x-cloak
      @keydown.escape.window="showNewSessionModal = false"
    >
      <div class="bg-gray-800 rounded-lg max-w-lg w-full p-6" @click.outside="showNewSessionModal = false">
        <h2 class="text-xl font-bold mb-4">New Session</h2>

        <!-- Repo Picker -->
        <div class="mb-4">
          <label class="block text-sm font-medium text-gray-400 mb-2">Repository</label>
          <select
            x-model="selectedRepoPickId"
            class="w-full bg-gray-700 text-white rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
          >
            <option value="">Select a repository...</option>
            <optgroup label="Local Workspaces">
              <template x-for="item in repoPickerItems.filter(i => i.type === 'local')" :key="item.id">
                <option :value="item.path" x-text="item.name"></option>
              </template>
            </optgroup>
            <optgroup label="Clone from GitHub">
              <template x-for="item in repoPickerItems.filter(i => i.type === 'github' && !isCloned(i))" :key="item.id">
                <option :value="item.nameWithOwner" x-text="item.name"></option>
              </template>
            </optgroup>
          </select>
          <p x-show="repoPickerLoading" class="text-sm text-gray-500 mt-1">Loading repositories...</p>
          <p x-show="repoPickerError" class="text-sm text-red-400 mt-1" x-text="repoPickerError"></p>
        </div>

        <!-- Model -->
        <div class="mb-4">
          <label class="block text-sm font-medium text-gray-400 mb-2">Model</label>
          <select
            x-model="newSessionModel"
            class="w-full bg-gray-700 text-white rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
          >
            <option value="">Auto (default)</option>
            <template x-for="model in availableModels" :key="model.id">
              <option :value="model.id" x-text="model.name"></option>
            </template>
          </select>
        </div>

        <!-- Actions -->
        <div class="flex justify-end gap-3">
          <button
            @click="showNewSessionModal = false"
            class="px-4 py-2 text-gray-400 hover:text-white transition-colors"
          >
            Cancel
          </button>
          <button
            @click="createSession()"
            :disabled="!selectedRepoPickId || repoCloneBusy"
            class="px-4 py-2 bg-blue-600 hover:bg-blue-500 disabled:bg-gray-600 disabled:cursor-not-allowed rounded-lg font-medium transition-colors"
          >
            <span x-show="!repoCloneBusy">Create Session</span>
            <span x-show="repoCloneBusy">Cloning...</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="dashboard.js"></script>
</body>
</html>
